name: Build Tabler Offline Browser

on:
  push:
    branches:
      - automation/tabler-offline-browser-20260809
    paths:
      - 'scripts/build-tabler-offline-browser.mjs'
      - '.github/workflows/build-tabler-offline-browser.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/build-tabler-offline-browser.mjs'
      - '.github/workflows/build-tabler-offline-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install official Tabler source package
        run: npm install --no-save --ignore-scripts @tabler/icons@3.46.0

      - name: Fix embedded runtime template quoting
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/build-tabler-offline-browser.mjs')
          s = p.read_text()
          old = "(items.length?`${start+1}–${start+items.length}`:'0')"
          new = "(items.length?((start+1)+'–'+(start+items.length)):'0')"
          if old not in s:
              raise SystemExit('expected runtime template snippet not found')
          s = s.replace(old, new)
          s = s.replace("const NS='http://www.w3.org/2000/svg';", "const NS='http'+':/'+'/www.w3.org/2000/svg';")
          lines = s.splitlines()
          remote_fixed = False
          fetch_fixed = False
          for i, line in enumerate(lines):
              if 'Offline HTML unexpectedly contains a remote URL' in line:
                  lines[i] = "if (htmlText.includes('http://') || htmlText.includes('https://')) throw new Error('Offline HTML unexpectedly contains a remote URL');"
                  remote_fixed = True
              elif 'Offline HTML unexpectedly contains fetch()' in line:
                  lines[i] = "if (htmlText.includes('fetch(')) throw new Error('Offline HTML unexpectedly contains fetch()');"
                  fetch_fixed = True
          if not remote_fixed or not fetch_fixed:
              raise SystemExit('expected offline validation lines not found')
          p.write_text('\n'.join(lines) + '\n')
          PY

      - name: Build fully offline browser
        run: node scripts/build-tabler-offline-browser.mjs

      - name: Verify artifact
        run: |
          test -f dist-tabler-offline-browser/AI编程日志_Tabler_离线图标浏览器_v1.0/index.html
          test -f dist-tabler-offline-browser/AI编程日志_Tabler_离线图标浏览器_v1.0.zip
          test -f dist-tabler-offline-browser/AI编程日志_Tabler_离线图标浏览器_v1.0_SHA256.txt
          du -h dist-tabler-offline-browser/AI编程日志_Tabler_离线图标浏览器_v1.0/index.html
          cat dist-tabler-offline-browser/AI编程日志_Tabler_离线图标浏览器_v1.0_SHA256.txt

      - name: Upload offline browser artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI编程日志_Tabler_离线图标浏览器_v1.0
          path: dist-tabler-offline-browser/
          if-no-files-found: error
          retention-days: 7
